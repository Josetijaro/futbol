<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Clásico | The Unrivaled Match | October 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;900&family=Playfair+Display:ital,wght@1,400;1,700&display=swap" rel="stylesheet">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/53/53283.png">
    <link rel="stylesheet" href="styleC.css">
    
</head>
<body>

<nav>
    <div class="nav-container">
        <div class="brand">LaLiga / Special Edition</div>
        <a href="index.html"><button class="btn-inicio" onclick="window.scrollTo({top:0, behavior:'smooth'})">Inicio</button></a>
    </div>
</nav>

<section class="match-hero">
    <div class="background-split">
        <div class="bg-side madrid-bg"></div>
        <div class="bg-side barca-bg"></div>
    </div>
    <div class="overlay-gradient"></div>

    <div class="main-content">
        <div class="supra-title">The World is Watching</div>
        <h1 class="match-title">
            Madrid<span class="vs">vs</span>Barça
        </h1>
        <p class="venue-info">Santiago Bernabéu, Madrid / Octubre 2026</p>

        <div class="countdown" id="timer">
            <div class="time-box">
                <span id="days">00</span>
                <label>Días</label>
            </div>
            <div class="separator">/</div>
            <div class="time-box">
                <span id="hours">00</span>
                <label>Horas</label>
            </div>
            <div class="separator">/</div>
            <div class="time-box">
                <span id="minutes">00</span>
                <label>Minutos</label>
            </div>
            <div class="separator">/</div>
            <div class="time-box">
                <span id="seconds">00</span>
                <label>Segundos</label>
            </div>
        </div>
    </div>
</section>
   <script src="scriptC.js"></script>
</body>
</html>
